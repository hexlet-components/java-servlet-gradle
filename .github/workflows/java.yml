name: Java CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '20'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          fetch-depth: 0
      - name: Execute Gradle build
        run: ./gradlew build
